<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Icon Emblem -->
  <rect x="8" y="10" width="44" height="44" rx="12" fill="#0f172a" stroke="url(#brandGrad)" stroke-width="2.5" />
  <circle cx="20" cy="22" r="4" fill="#ef4444" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <path d="M22 34 L28 26 L34 40 L40 32" stroke="url(#brandGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Wordmark -->
  <text x="64" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="0.5">NEWS<tspan fill="url(#brandGrad)">SECONDS</tspan></text>
  <text x="65" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#94a3b8" letter-spacing="2">IN SECONDS • VISUAL STORIES</text>
</svg>
