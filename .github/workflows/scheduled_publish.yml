name: Automated News Ingestion & Rebuild

on:
  schedule:
    # Staggered organic publishing schedule (6 times daily at non-round IST minutes)
    - cron: '43 22 * * *' # 04:13 AM IST
    - cron: '23 2 * * *'  # 07:53 AM IST
    - cron: '3 6 * * *'   # 11:33 AM IST
    - cron: '27 9 * * *'  # 02:57 PM IST
    - cron: '47 13 * * *' # 07:17 PM IST
    - cron: '19 18 * * *' # 11:49 PM IST
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

concurrency:
  group: news-publishing-sync
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fetch, Summarization & Build Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://newsseconds.com' }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY || '' }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          REDDIT_SUBREDDIT: ${{ secrets.REDDIT_SUBREDDIT }}
          ENABLE_TELEGRAM_POSTING: ${{ secrets.ENABLE_TELEGRAM_POSTING || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          ENABLE_TUMBLR_POSTING: ${{ secrets.ENABLE_TUMBLR_POSTING || 'true' }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
          TUMBLR_OAUTH_SECRET: ${{ secrets.TUMBLR_OAUTH_SECRET }}
          TUMBLR_BLOG_NAME: ${{ secrets.TUMBLR_BLOG_NAME || 'newsseconds' }}
        run: |
          python fetch_and_generate.py --count 2 --max-fresh 14 --skip-val

      - name: Prune Old Vercel Deployments
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          python scripts/prune_vercel_deployments.py 3

      - name: Commit and Push Fresh News to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ dist/
          if git diff --staged --quiet; then
            echo "Everything up to date. No new breaking stories to commit."
          else
            git commit -m "Auto-refresh: latest breaking news & visual stories [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
